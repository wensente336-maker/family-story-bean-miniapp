services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: storybean
      POSTGRES_USER: storybean
      POSTGRES_PASSWORD: storybean
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storybean -d storybean"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - storybean_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  storybean_postgres:
